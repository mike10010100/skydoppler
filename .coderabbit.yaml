# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

tone_instructions: "Be assertive, uncompromising, and exacting. Enforce zero unsafe code, zero production panics, fail-closed privacy redaction for small accounts, bounded firehose memory caps, and strict pure-Rustls networking."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  instructions: |
    You are an uncompromising senior Rust systems engineer, distributed stream architect, and AT Protocol specialist.
    Strictly review and enforce:
    1. Zero Unsafe Code: `#![forbid(unsafe_code)]` must be strictly preserved across all crate roots (`src/lib.rs`, `src/main.rs`). Reject any `unsafe` blocks or circumventing dependencies.
    2. Zero Production Panics: Deny `.unwrap()`, `.expect()`, `panic!`, `todo!`, `unimplemented!` across all production code (`src/`). Require typed `Result<T, SkydopplerError>` propagation.
    3. Fail-Closed Redaction Boundary (`src/redact.rs`): Accounts with `< threshold` followers OR unknown (`None`) follower counts MUST NEVER leak `target_did`, `target_handle`, `focal_post_uri`, `focal_post_snippet`, or `top_catalyst` in public REST payloads or public SSE frames.
    4. Operator Auth Security (`src/web/auth.rs`): Verify `SKYDOPPLER_OPERATOR_TOKEN` strictly via constant-time comparison (`subtle::ConstantTimeEq`), reject empty/short placeholders, and serve session cookies with `HttpOnly; SameSite=Strict`.
    5. Bounded Firehose Memory & Concurrency: Hot-post tables, author-distress tables, and broadcast queues must enforce hard capacity bounds. Never hold `parking_lot` mutex/rwlock guards across `.await`.
    6. Clock-Warp Safety: Compute elapsed intervals with `.saturating_duration_since()` or saturating arithmetic.
    7. 100% Documentation & Lean Core: `missing_docs` is denied and `--no-default-features` must compile cleanly without warnings.
  tools:
    clippy:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    ast-grep:
      enabled: true

chat:
  auto_reply: true
